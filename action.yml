name: "dependabot-devbox"
description: "Automatically update Devbox packages and open PRs, like Dependabot but for devbox.json"

inputs:
  github-token:
    description: "GitHub token with repo write access (to open PRs)"
    required: true
  directory:
    description: "Directory containing devbox.json (relative to repo root)"
    required: false
    default: "/"
  base-branch:
    description: "Base branch to open PRs against. Defaults to the repo default branch."
    required: false
    default: ""
  gem-version:
    description: "Pin a specific dependabot-devbox gem version (e.g. '0.1.0'). Defaults to latest."
    required: false
    default: ""
  group-updates:
    description: >-
      Group minor/patch updates into a single PR; each major update still gets its own PR.
      When "false", every update (major or not) gets its own PR.
    required: false
    default: "false"
  cooldown-days:
    description: "Skip a package version until it has been released for this many days. Set to 0 to disable."
    required: false
    default: "7"

runs:
  using: "composite"
  steps:
    - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
      with:
        enable-cache: "true"

    - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
      with:
        ruby-version: "3.3"

    - name: Install dependabot-devbox
      shell: bash
      # zizmor: ignore[adhoc-packages] -- this action's entire purpose is to install and run the dependabot-devbox CLI
      run: |
        if [ -n "${INPUTS_GEM_VERSION}" ]; then
          gem install dependabot-devbox -v "${INPUTS_GEM_VERSION}"
        else
          gem install dependabot-devbox
        fi
      env:
        INPUTS_GEM_VERSION: ${{ inputs.gem-version }}

    - name: Run devbox dependency updates
      shell: bash
      env:
        GITHUB_ACCESS_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        DIRECTORY_PATH: ${{ inputs.directory }}
        GROUP_UPDATES: ${{ inputs.group-updates }}
        COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
        INPUTS_BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        [ -n "${INPUTS_BASE_BRANCH}" ] && export BASE_BRANCH="${INPUTS_BASE_BRANCH}"
        dependabot-devbox-update
